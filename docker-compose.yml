services:
  db:
    image: postgres:16-alpine
    container_name: mentormatch_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - mentormatch_data:/var/lib/postgresql/data
      - ./database/schema_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mentormatch_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app           # <--- NUEVO: Sincroniza el código del backend
      - /app/node_modules        # <--- Mantiene los módulos locales intactos
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mentormatch_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true # <--- NUEVO: Obligatorio para Windows/Docker
    volumes:
      - ./frontend:/app          # <--- Sincroniza el código del frontend
      - /app/node_modules        # <--- Mantiene los módulos locales intactos
    depends_on:
      - backend

volumes:
  mentormatch_data: 