services:
  db:
    image: postgres:16-alpine
    container_name: mentormatch_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - mentormatch_data:/var/lib/postgresql/data
      - ./database/schema_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mentormatch_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mentormatch_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin_mentormatch
      - MINIO_ROOT_PASSWORD=super_secreto_123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Esperando a que MinIO despierte...';
      sleep 5;
      mc alias set localminio http://minio:9000 admin_mentormatch super_secreto_123;
      mc mb localminio/mentormatch-media --ignore-existing;
      mc anonymous set download localminio/mentormatch-media;
      echo 'Bodega automatizada y lista para usar.';
      exit 0;
      "

volumes:
  mentormatch_data:
  minio_data: